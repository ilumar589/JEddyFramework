name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Headless SDL for window/input/audio tests (DESIGN §14). GPU tests are excluded by default.
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      # Also validates the Gradle wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Configuration cache reuse check
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee -a build.log | grep -E "Configuration cache entry reused|Reusing configuration cache"

      # glslangValidator makes the cook compile every shader permutation (DESIGN §10.3).
      - name: Install glslang
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q glslang-tools

      # The sample's procedural assets through the dev.jeddy.assets plugin: a full cook, then a
      # rerun that the cooker's cache must serve completely, then paks (TASKS M6-09).
      - name: Cook and pack the sample assets
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :iso-demo:cookAssets :iso-demo:packAssets --stacktrace 2>&1 | tee cook.log
          grep -E "^[0-9]+ cooked, 0 cached, 0 failed" cook.log
          ./gradlew :iso-demo:cookAssets --rerun 2>&1 | tee -a cook.log | grep -E "^0 cooked, [0-9]+ cached, 0 failed"
          ls -l samples/iso-demo/build/paks
          py=python3; $py --version > /dev/null 2>&1 || py=python
          $py .github/scripts/cook-summary.py samples/iso-demo/build/cook-cache/report/report.json

      # Raw logs need a login to read; annotations surface failures in the checks API and PR view.
      - name: Annotate failure
        if: failure()
        shell: bash
        run: |
          bash .github/scripts/annotate-failure.sh build.log
          if [ -f cook.log ]; then bash .github/scripts/annotate-failure.sh cook.log; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  gpu:
    name: GPU tests (Mesa llvmpipe)
    runs-on: ubuntu-latest
    needs: build
    env:
      # Software GL under Xvfb. llvmpipe implements GL 4.5 plus most of 4.6; the override lets
      # the 4.6 core context be created so GL code paths run in CI (DESIGN §9.7).
      SDL_VIDEO_DRIVER: x11
      SDL_AUDIO_DRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '4.6'
      MESA_GLSL_VERSION_OVERRIDE: '460'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Xvfb and Mesa
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: GPU tests
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew test -Pjeddy.gpuTests=only --stacktrace 2>&1 | tee gpu.log

      - name: Hello triangle smoke run (module path, 3 s)
        shell: bash
        env:
          JEDDY_SAMPLE_QUIT_AFTER: '3'
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :hello-triangle:run --stacktrace 2>&1 | tee -a gpu.log

      # The iso demo end to end on llvmpipe: cook and pack, load the crypt, play for 20 s and keep a
      # screenshot (HUD and profiler on) for review (TASKS M10).
      - name: Iso demo smoke run with a screenshot
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :iso-demo:run --stacktrace \
            --args="--size 960x540 --quit-after 20 --screenshot build/screenshots/ci.png --screenshot-at 8 --profiler" 2>&1 | tee -a gpu.log
          python3 .github/scripts/png-check.py samples/iso-demo/build/screenshots/ci.png

      # The standalone editor on the crypt (TASKS M14-08): cooks the sample's assets, opens the
      # level with two tiles selected, draws 30 frames and keeps a screenshot.
      - name: Editor smoke run with a screenshot
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :editor-tool:run --stacktrace \
            --args="--project samples/iso-demo/assets --level levels/crypt.jlevel --shader-include modules/render/src/main/resources/dev/jeddy/render/shaders --size 1280x720 --frames 30 --screenshot samples/iso-demo/build/screenshots/editor.png --command \"select 150 151\"" 2>&1 | tee -a gpu.log
          python3 .github/scripts/png-check.py samples/iso-demo/build/screenshots/editor.png

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-demo-screenshot
          path: samples/iso-demo/build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Annotate failure
        if: failure()
        shell: bash
        run: bash .github/scripts/annotate-failure.sh gpu.log

  perf:
    name: Perf scene (headless game thread)
    runs-on: ubuntu-latest
    needs: build
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      # TASKS M10-05: 300 agents, fireballs, fog of war and 16k props, two minutes after a warm-up.
      # Allocation fails the job, except at C2 compiles in the run's JIT log (D70); times are
      # reported (shared runners are noisy). GPU budgets need real hardware.
      - name: Perf capture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p samples/iso-demo/build/perf
          ./gradlew :iso-demo:run --stacktrace \
            -Pjeddy.jvmArgs="-Xlog:gc*:file=build/perf/gc.log -Xlog:class+load=info:file=build/perf/classload.log:uptime" \
            --args="--headless --perf 120 --warmup 30 --alloc-probe --report build/perf --fail-on alloc,flags" 2>&1 | tee perf.log

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f samples/iso-demo/build/perf/perf.md ]; then cat samples/iso-demo/build/perf/perf.md >> "$GITHUB_STEP_SUMMARY"; fi
          python3 .github/scripts/perf-annotate.py samples/iso-demo/build/perf/perf.json || true
          python3 .github/scripts/late-classes.py samples/iso-demo/build/perf/perf.json samples/iso-demo/build/perf/classload.log || true

      - name: Annotate failure
        if: failure()
        shell: bash
        run: bash .github/scripts/annotate-failure.sh perf.log

      - name: Upload the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: samples/iso-demo/build/perf/
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: build
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install fakeroot (jpackage .deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot

      # TASKS M11-01/02: jlink runtime, launchers, paks and an AOT cache trained by a headless run,
      # zipped; then a jpackage app image (and a .deb on Linux).
      - name: Image and packages
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :iso-demo:distImageZip :iso-demo:jpackage --stacktrace 2>&1 | tee package.log
          if [ "$RUNNER_OS" = "Linux" ]; then
            ./gradlew :iso-demo:jpackage -Pjeddy.package.type=deb --stacktrace 2>&1 | tee -a package.log
          fi
          ls -l samples/iso-demo/build/distributions samples/iso-demo/build/jpackage

      # Cold start to first frame with and without the AOT cache (headless: no GPU on runners).
      - name: Startup time
        shell: bash
        run: |
          set -o pipefail
          image=samples/iso-demo/build/dist/iso-demo
          launcher="$image/bin/iso-demo"
          if [ "$RUNNER_OS" = "Windows" ]; then launcher="$image/bin/iso-demo.bat"; fi
          py=python3; $py --version > /dev/null 2>&1 || py=python
          $py .github/scripts/startup-bench.py "AOT cache" 5 1500 -- "$launcher" --headless --quit-after-first-frame --no-audio
          mv "$image/aot" "$image/aot.off"
          $py .github/scripts/startup-bench.py "no AOT cache" 5 1500 -- "$launcher" --headless --quit-after-first-frame --no-audio
          mv "$image/aot.off" "$image/aot"

      - name: Annotate failure
        if: failure()
        shell: bash
        run: bash .github/scripts/annotate-failure.sh package.log

      - name: Upload the image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-demo-${{ runner.os }}
          path: |
            samples/iso-demo/build/distributions/*.zip
            samples/iso-demo/build/jpackage/*.deb
          if-no-files-found: ignore
          retention-days: 14

  # docs/getting-started.md (TASKS M11-04): a game project outside the framework's build, on the
  # dev.jeddy.game plugin and dev.jeddy:jeddy-* dependencies through a composite build. Builds,
  # cooks and packages it, then runs the packaged game for 60 frames on llvmpipe.
  template:
    name: Game template (composite build)
    runs-on: ubuntu-latest
    needs: build
    env:
      SDL_VIDEO_DRIVER: x11
      SDL_AUDIO_DRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '4.6'
      MESA_GLSL_VERSION_OVERRIDE: '460'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Xvfb and Mesa
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Build, cook and package the template
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -p samples/game-template build distImage --stacktrace 2>&1 | tee template.log
          find samples/game-template/build/dist/my-game -maxdepth 2 | sort | tee -a template.log

      - name: Run the packaged game for 60 frames
        shell: bash
        run: |
          set -o pipefail
          JDK_JAVA_OPTIONS=-Djeddy.app.quitAfterFrames=60 xvfb-run -a -s "-screen 0 1280x720x24" \
            samples/game-template/build/dist/my-game/bin/my-game 2>&1 | tee -a template.log

      - name: Annotate failure
        if: failure()
        shell: bash
        run: bash .github/scripts/annotate-failure.sh template.log

  bench:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      # GlBench needs a GL 4.6 context: Xvfb with Mesa llvmpipe, as in the gpu job.
      - name: Install Xvfb and Mesa
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0

      # Short runs: numbers are indicative only (shared runner, 1 fork, few iterations).
      - name: Run JMH
        env:
          SDL_VIDEO_DRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          JEDDY_ZSTD_CORPUS: ${{ github.workspace }}/zstd-corpus.bin
        run: xvfb-run -a ./gradlew :bench:jmh "-Pjmh.args=-f 1 -wi 2 -i 3 -w 500ms -r 500ms"

      # TASKS M4-01: the facade's throughput against the zstd CLI on the same corpus and machine.
      - name: zstd CLI on the ZstdBench corpus
        if: always()
        run: bash .github/scripts/zstd-cli-bench.sh zstd-corpus.bin

      - name: Report
        if: always()
        run: python3 .github/scripts/jmh-annotate.py bench/build/reports/jmh/results.json
