name: Docs

# TASKS M11-04: the Javadoc site (every module plus an index), built on main. Publishing to GitHub
# Pages needs Pages enabled with "GitHub Actions" as the source and the repository variable
# PAGES_ENABLED=true; otherwise the site is only uploaded as an artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Javadoc site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the site
        run: ./gradlew :site:javadocSite --stacktrace

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/site/build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
