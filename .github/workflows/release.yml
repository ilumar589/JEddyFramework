name: Release

# TASKS M11-05: a tag v<major>.<minor>.<patch> publishes every library, the cooker, the natives jars
# and the Gradle plugins (dev.jeddy.game, dev.jeddy.assets) to GitHub Packages at that version, and
# attaches the iso demo images and packages of both platforms to a GitHub release. The version is
# written into gradle.properties first, so the plugins resolve the cooker and natives they were
# released with (build-logic reads it from there).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set the version
        run: sed -i "s/^jeddy.version=.*/jeddy.version=${GITHUB_REF_NAME#v}/" gradle.properties

      - name: Build, test and publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew build publish --stacktrace
          ./gradlew -p build-logic publish --stacktrace

  packages:
    name: Demo image (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install fakeroot (jpackage .deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot

      - name: Image and package
        shell: bash
        run: |
          sed -i "s/^jeddy.version=.*/jeddy.version=${GITHUB_REF_NAME#v}/" gradle.properties
          ./gradlew :iso-demo:distImageZip --stacktrace
          if [ "$RUNNER_OS" = "Linux" ]; then
            ./gradlew :iso-demo:jpackage -Pjeddy.package.type=deb --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            samples/iso-demo/build/distributions/*.zip
            samples/iso-demo/build/jpackage/*.deb
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [publish, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Jeddy $GITHUB_REF_NAME" --generate-notes dist/*
