# Framework version (applied to every project by the jeddy.java-base convention plugin).
jeddy.version=0.2.0-SNAPSHOT
jeddy.repo.url=https://github.com/ilumar589/JEddyFramework

# Prebuilt native libraries (release natives-v<N>, built by .github/workflows/natives.yml).
# Use a local natives/build.py output instead with -Pjeddy.natives.dir=<dir with natives.json>.
jeddy.natives.version=1
jeddy.natives.sha256.linux-x64=fb768733fdf6d7d20637378fae06124029347b0d6e6b9895a758d95c7614aa48
jeddy.natives.sha256.windows-x64=21bdd830fb47a3f355897cc2dc855aba99aee822d78db40a51841e01defd184a

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# google-java-format (Spotless) needs javac internals when it runs inside the daemon.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
